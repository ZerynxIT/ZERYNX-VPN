name = "zerynx-vpn"
main = "src/index.js"
compatibility_date = "2025-11-01"
workers_dev = true
upload_source_maps = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "zerynx-panel-db"
database_id = "6b27d135-f1bd-430f-86d4-2292e2c525e3"
migrations_dir = "schema"

[vars]
ALLOWED_ORIGINS = "https://zerynxit.github.io"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
