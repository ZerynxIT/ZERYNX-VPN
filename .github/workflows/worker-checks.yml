name: Worker checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      - name: Run Worker tests
        working-directory: worker
        run: npm test
      - name: Check JavaScript syntax
        working-directory: worker
        run: |
          node --check src/index.js
          node --check src/subscriptions.js
          node --check src/transport.js
          node --check src/wire.js
          node --check ../assets/js/app.js
          node --check public/assets/js/app.js

      - name: Validate Worker deployment bundle (worker config)
        working-directory: worker
        run: npx wrangler deploy --dry-run

      - name: Validate production root Wrangler configuration
        working-directory: worker
        run: npx wrangler deploy --dry-run --config ../wrangler.toml
